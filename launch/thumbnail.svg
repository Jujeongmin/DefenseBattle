<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Random Defense</title>
  <desc>Key art for Random Defense, a random-summon tower defense game.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#35485c"/>
      <stop offset="55%" stop-color="#1c2530"/>
      <stop offset="100%" stop-color="#0c1016"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b0"/>
      <stop offset="45%" stop-color="#ffcf3f"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe0ff"/>
      <stop offset="100%" stop-color="#2a7fd0"/>
    </linearGradient>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#8a1f1f"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ffcf3f" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <g opacity="0.10" stroke="#9fd0ff" stroke-width="2" fill="none">
    <path d="M-40 470 L360 300 L760 470 L1160 300"/>
    <path d="M-40 560 L360 390 L760 560 L1160 390"/>
    <path d="M360 300 L360 620 M760 470 L760 675"/>
  </g>

  <path d="M1180 70 C 900 150 1080 320 800 360 C 560 395 720 540 470 560 C 300 573 380 660 120 640"
        fill="none" stroke="#ff6a6a" stroke-width="4" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.55"/>

  <g opacity="0.9">
    <circle cx="1010" cy="205" r="13" fill="#6bd06b" stroke="#0e3a12" stroke-width="3"/>
    <circle cx="770" cy="405" r="13" fill="#8f6bd0" stroke="#2a1750" stroke-width="3"/>
    <circle cx="540" cy="540" r="13" fill="#c56b6b" stroke="#4a1414" stroke-width="3"/>
  </g>

  <g transform="translate(90,70)" filter="url(#soft)">
    <path d="M22 0 L44 16 L36 44 L8 44 L0 16 Z" fill="url(#gem)" stroke="#0d3a63" stroke-width="2"/>
    <path d="M22 0 L44 16 L22 22 L0 16 Z" fill="#bfeaff" opacity="0.85"/>
  </g>
  <text x="150" y="102" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#e9c65a">RANDOM-SUMMON TOWER DEFENSE</text>

  <g transform="translate(1010,92)" filter="url(#soft)">
    <circle r="52" fill="#e23b3b" stroke="#8a1f1f" stroke-width="4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#fff">50</text>
    <text x="0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ffd9d9">WAVES</text>
  </g>

  <g filter="url(#soft)">
    <g transform="translate(455,185)">
      <circle r="52" fill="#1b2634" stroke="#ffb23e" stroke-width="5"/>
      <path d="M-20 -22 A 30 30 0 0 1 -20 22" fill="none" stroke="#ffd98a" stroke-width="5" stroke-linecap="round"/>
      <path d="M-22 0 L22 0" stroke="#ffd98a" stroke-width="4"/>
      <path d="M12 -8 L24 0 L12 8" fill="none" stroke="#ffd98a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(600,160)">
      <circle r="56" fill="#1b2634" stroke="#a45cff" stroke-width="5"/>
      <path d="M-14 26 L14 -22" stroke="#d9b8ff" stroke-width="6" stroke-linecap="round"/>
      <path d="M14 -30 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 z" fill="#ffe9a8"/>
    </g>
    <g transform="translate(745,185)">
      <circle r="52" fill="#1b2634" stroke="#ff5252" stroke-width="5"/>
      <path d="M2 -26 L10 -18 L-6 18 L-14 10 Z" fill="#e6edf5" stroke="#9fb0c8" stroke-width="2"/>
      <path d="M-8 12 L-20 24 M-16 8 L-24 16" stroke="#c9d4e0" stroke-width="5" stroke-linecap="round"/>
      <path d="M6 -20 L-14 4" stroke="#ff9d9d" stroke-width="2"/>
    </g>
  </g>

  <g filter="url(#titleShadow)" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900">
    <text x="600" y="360" font-size="150" letter-spacing="4" fill="url(#gold)" stroke="#7a1717" stroke-width="3">RANDOM</text>
    <text x="600" y="490" font-size="150" letter-spacing="8" fill="url(#gold)" stroke="#7a1717" stroke-width="3">DEFENSE</text>
  </g>

  <text x="600" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="3" fill="#cfe0f0">Summon &#183; Defend &#183; Survive 50 Waves</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1" text-anchor="middle">
    <g transform="translate(90,590)"><rect width="160" height="42" rx="21" fill="#aab4c2"/><text x="80" y="28" fill="#2a3038">COMMON</text></g>
    <g transform="translate(270,590)"><rect width="160" height="42" rx="21" fill="#57c96a"/><text x="80" y="28" fill="#0f3d1c">RARE</text></g>
    <g transform="translate(450,590)"><rect width="160" height="42" rx="21" fill="#4aa3ff"/><text x="80" y="28" fill="#0c2f5c">ELITE</text></g>
    <g transform="translate(630,590)"><rect width="160" height="42" rx="21" fill="#a45cff"/><text x="80" y="28" fill="#351066">LEGENDARY</text></g>
    <g transform="translate(810,590)"><rect width="160" height="42" rx="21" fill="#ffb23e"/><text x="80" y="28" fill="#5c3608">MYTHIC</text></g>
    <g transform="translate(990,590)"><rect width="160" height="42" rx="21" fill="#ff5252"/><text x="80" y="28" fill="#5c1414">ETERNAL</text></g>
  </g>
</svg>
