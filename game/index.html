<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>랜덤 디펜스</title>
  </head>
  <body>
    <div id="app">
      <!-- 로비 (menu.ts 가 내용을 그림) -->
      <div id="main-menu" class="hidden"></div>

      <div id="game-frame" class="hidden">
        <!-- 상단 바 -->
        <header id="topbar">
          <div class="top-left">
            <div id="mob-portrait" class="frame-sprite"></div>
            <div>
              <div id="mob-race">-</div>
              <div id="stage-label"></div>
            </div>
          </div>
          <div class="top-center">
            <div id="wave-label">Wave 1</div>
            <div id="boss-timer" class="hidden">120.0</div>
          </div>
          <div class="top-right">
            <button id="btn-mute" class="icon-btn"><i class="pi pi-sound"></i></button>
            <button id="btn-pause" class="icon-btn"><i class="pi pi-pause"></i></button>
            <button id="btn-speed" class="icon-btn">1x</button>
          </div>
        </header>

        <!-- PvP: 상대 상태 -->
        <!-- 상대 정보 한 줄 + 상대 전장. PvP 에선 #pvp-hud 가 display:contents 라 둘 다 #game-frame 의 줄이 된다 -->
        <div id="pvp-hud" class="hidden">
          <div class="opp-info">
            <div class="opp-name"><span class="side-tag opp">상대</span> <span id="opp-nick">상대</span><span id="opp-bot" class="hidden"> <i class="pi pi-robot"></i></span> <span id="opp-trophy" class="trophy"></span></div>
            <div class="opp-bar"><div id="opp-fill"></div><span id="opp-count">0 / 100</span></div>
            <div class="opp-sub" id="opp-sub">Wave 1 · 유닛 0</div>
          </div>
          <canvas id="opp-canvas" width="72" height="72"></canvas>
          <div class="opp-label"><span class="side-tag opp">상대 전장</span><div id="opp-deck"></div></div>
        </div>

        <!-- 전장 -->
        <main id="battlefield">
          <canvas id="game-canvas"></canvas>
          <div id="summon-log"></div>
          <div id="gold-badge"><i class="pi pi-coin"></i><span id="gold-amount">100</span></div>
          <div id="mythic-banner" class="hidden"></div>
          <div id="countdown" class="hidden"></div>
          <div id="coach" class="hidden"></div>
          <div id="debug-panel" class="hidden">
            <button id="debug-mythic">DEV 신화</button>
            <button id="debug-eternal">DEV 태초</button>
            <button id="debug-gold">DEV +500G</button>
          </div>
        </main>

        <!-- 진행 바 -->
        <div id="progress-row">
          <div id="mob-progress-bar"><div id="mob-progress-fill"></div></div>
          <span class="side-tag me pvp-only">내 전장</span>
          <div id="mob-count-label">0 / 100</div>
        </div>

        <!-- 하단 조작부 -->
        <section id="controls">
          <!-- PvP 몹 던지기 카드 (ui.ts 가 채움): 위쪽 상대 전장으로 끌어다 놓는다 -->
          <div id="attack-row" class="hidden"></div>
          <div class="control-buttons">
            <button id="btn-sell-panel" class="side-btn"><i class="pi pi-helmet"></i>영웅<span id="merge-dot" class="dot hidden"></span></button>
            <div class="summon-wrap">
              <div id="ticket-row"></div>
              <button id="btn-summon" class="summon-btn">
                <span class="summon-title">소환</span>
                <span class="summon-cost"><i class="pi pi-coin"></i>20</span>
              </button>
            </div>
            <button id="btn-menu" class="side-btn"><i class="pi pi-home"></i>나가기</button>
          </div>
          <div id="unit-stacks"></div>
        </section>
      </div>

      <!-- 오버레이 패널들 -->
      <div id="sell-panel" class="overlay hidden"></div>
      <div id="panel" class="overlay hidden"></div>
      <div id="modal" class="overlay hidden"></div>
      <div id="gameover-panel" class="overlay hidden"></div>
      <div id="toast-layer"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
